name: Build Android APK

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL de l'API (ex: https://ton-serveur.com/api)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Fix platform-specific deps
        run: sed -i '/lightningcss-win32/d' package.json

      - name: Configure API URL
        run: |
          URL="${API_URL:-${SECRET_URL:-$(grep NEXT_PUBLIC_API_URL .env.production | cut -d= -f2-)}}"
          echo "Using API URL: $URL"
          echo "NEXT_PUBLIC_API_URL=$URL" > .env.production
          echo "NEXT_PUBLIC_API_PORT=5001" >> .env.production
        env:
          API_URL: ${{ inputs.api_url || '' }}
          SECRET_URL: ${{ secrets.API_URL || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: frontend/android

      - name: Build APK (debug)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android

      - uses: actions/upload-artifact@v4
        with:
          name: life-os-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
